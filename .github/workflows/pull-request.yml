name: PR build

on: [pull_request]

jobs:
  ubuntu-build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: 21.0.3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Use Node.js
        uses: actions/setup-node@v1
        with:
          node-version: '10.22.1'

      - name: Set Up Ballerina
        uses: ballerina-platform/setup-ballerina@v1.1.1
        with:
          version: 2201.12.2

      - name: Restore Ballerina dependencies cache
        uses: actions/cache/restore@v4
        id: cache-ballerina-restore
        with:
          path: /home/runner/.ballerina/repositories/
          key: ${{ runner.os }}-ballerina-${{ hashFiles('**/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-ballerina-

      - name: Build with Gradle
        env:
          packageUser: ${{ github.actor }}
          packagePAT: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew build -x :createArtifactZip

      - name: Save Ballerina dependencies cache
        uses: actions/cache/save@v4
        if: always()  # Try to save cache even if build fails
        with:
          path: /home/runner/.ballerina/repositories/
          key: ${{ steps.cache-ballerina-restore.outputs.cache-primary-key }}

#      - name: Generate Codecov Report
